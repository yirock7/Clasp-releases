<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 230">
  <style>
    svg {
      --band-hi: #646567;
      --band: #222326;
      --band-lo: #131315;
      --band-edge: #7f7f81;
      --cup-hi: #67686a;
      --cup: #26272a;
      --cup-lo: #151517;
      --cup-edge: #818283;
      --cushion-hi: #515253;
      --cushion: #1a1b1d;
      --cushion-lo: #0e0f10;
      --cushion-edge: #7a7b7c;
      --metal-lo: #5b5d61;
      --metal-mid: #a6a9b0;
      --metal-hi: #d7d8db;
      --metal-edge: #6c6e72;
      --sheen: #ffffff;
    }
    svg[data-colorway="black"] {
    }
    svg[data-colorway="deep-brown"] {
      --band-hi: #806d68;
      --band: #4a2f27;
      --band-lo: #291a15;
      --band-edge: #968682;
      --cup-hi: #8f7c74;
      --cup: #523529;
      --cup-lo: #39251d;
      --cup-edge: #2d1d17;
      --cushion-hi: #685852;
      --cushion: #38231c;
      --cushion-lo: #1f130f;
      --cushion-edge: #8c7f7b;
      --metal-lo: #62554a;
      --metal-mid: #b39a86;
      --metal-hi: #ddd2c9;
      --metal-edge: #746457;
    }
    svg[data-colorway="navy"] {
      --band-hi: #636d82;
      --band: #202e4c;
      --band-lo: #12192a;
      --band-edge: #7e8697;
      --cup-hi: #67728a;
      --cup: #263558;
      --cup-lo: #151d30;
      --cup-edge: #818a9e;
      --cushion-hi: #4f5768;
      --cushion: #182238;
      --cushion-lo: #0d131f;
      --cushion-edge: #797f8c;
      --metal-lo: #555b68;
      --metal-mid: #9aa6bd;
      --metal-hi: #d2d7e1;
      --metal-edge: #646c7b;
    }
    svg[data-colorway="sandstone"] {
      --band-hi: #e1d8cc;
      --band: #c9b8a2;
      --band-lo: #9d907e;
      --band-edge: #7d7264;
      --cup-hi: #e5dcd0;
      --cup: #d0c0aa;
      --cup-lo: #a29685;
      --cup-edge: #817769;
      --cushion-hi: #cfc4b5;
      --cushion: #b4a38c;
      --cushion-lo: #8c7f6d;
      --cushion-edge: #706557;
      --metal-lo: #7a7268;
      --metal-mid: #ddd0bd;
      --metal-hi: #f0eae1;
      --metal-edge: #90877b;
    }
  </style>

  <defs>
    <linearGradient id="bandV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--band-hi)"/>
      <stop offset=".4" stop-color="var(--band)"/>
      <stop offset="1" stop-color="var(--band-lo)"/>
    </linearGradient>
    <linearGradient id="padV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--cushion-lo)"/>
      <stop offset=".6" stop-color="var(--cushion)"/>
      <stop offset="1" stop-color="var(--cushion-hi)"/>
    </linearGradient>
    <linearGradient id="cupH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--cup-lo)"/>
      <stop offset=".28" stop-color="var(--cup-hi)"/>
      <stop offset=".62" stop-color="var(--cup)"/>
      <stop offset="1" stop-color="var(--cup-lo)"/>
    </linearGradient>
    <linearGradient id="cushH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--cushion-lo)"/>
      <stop offset=".5" stop-color="var(--cushion)"/>
      <stop offset="1" stop-color="var(--cushion-hi)"/>
    </linearGradient>
    <linearGradient id="metalH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--metal-lo)"/>
      <stop offset=".3" stop-color="var(--metal-hi)"/>
      <stop offset=".65" stop-color="var(--metal-mid)"/>
      <stop offset="1" stop-color="var(--metal-lo)"/>
    </linearGradient>
    <linearGradient id="cupShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".22"/>
    </linearGradient>
    <radialGradient id="shadowSoft" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000000" stop-opacity=".3"/>
      <stop offset=".5" stop-color="#000000" stop-opacity=".18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <g id="side">
      <g transform="rotate(-4 77.5 155)">
        <path d="M87.5,109 L97,109 C103,109 108,114 108,120 L108,190 C108,196.1 103,201 97,201 L87.5,201 C86.7,201 86,200.3 86,199.5 L86,110.5 C86,109.7 86.7,109 87.5,109 Z" fill="url(#cushH)" stroke="var(--cushion-edge)" stroke-width=".9"/>
        <path d="M105.7,118 C106.7,131 106.7,179 105.7,192" stroke="#ffffff" stroke-opacity=".22" stroke-width="1.3" fill="none" stroke-linecap="round"/>
        <path d="M79,106 L85,106 C86.1,106 87,106.9 87,108 L87,202 C87,203.1 86.1,204 85,204 L79,204 C69.7,204 62,196.3 62,187 L62,123 C62,113.7 69.7,106 79,106 Z" fill="url(#cupH)" stroke="var(--cup-edge)" stroke-width=".9"/>
        <path d="M79,106 L85,106 C86.1,106 87,106.9 87,108 L87,202 C87,203.1 86.1,204 85,204 L79,204 C69.7,204 62,196.3 62,187 L62,123 C62,113.7 69.7,106 79,106 Z" fill="url(#cupShade)"/>
        <path d="M66.2,124 C65.6,140 65.6,170 66.2,186" stroke="#ffffff" stroke-opacity=".42" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <path d="M72.2,107.8 L82,107.8" stroke="#ffffff" stroke-opacity=".28" stroke-width="1" fill="none" stroke-linecap="round"/>
        <path d="M87,108 L87,202" stroke="#000000" stroke-opacity=".3" stroke-width="1" fill="none"/>
        <path d="M88.2,110 L88.2,200" stroke="#ffffff" stroke-opacity=".18" stroke-width=".8" fill="none"/>
        <path d="M70.5,118 C71,141 71,169 70.5,192" stroke="#ffffff" stroke-opacity=".16" stroke-width=".9" fill="none"/>
      </g>
      <rect x="72" y="90" width="10" height="23" rx="2" fill="url(#metalH)" stroke="var(--metal-edge)" stroke-width=".8"/>
      <path d="M72.5,95 L81.5,95 M72.5,98.5 L81.5,98.5" stroke="#000000" stroke-opacity=".28" stroke-width=".7" fill="none"/>
      <path d="M65,114 C65,108.5 68.5,105 73,105 L81,105 C85.5,105 89,108.5 89,114 L89,118 C89,121 87,122.5 84,122.5 L70,122.5 C67,122.5 65,121 65,118 Z" fill="url(#cupH)" stroke="var(--cup-edge)" stroke-width=".9"/>
      <path d="M69,109 C72,107.6 80,107.6 85,109" stroke="#ffffff" stroke-opacity=".38" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    </g>
  </defs>

  <g data-part="shadow">
    <ellipse cx="150" cy="207" rx="108" ry="12" fill="url(#shadowSoft)"/>
  </g>

  <g data-part="body">
    <path d="M71.5,94 C65.5,47.2 97.6,16 150,16 C202.4,16 234.5,47.2 228.5,94 L217.5,94 C217.5,52.4 195,28 150,28 C105,28 82.5,52.4 82.5,94 Z" fill="url(#bandV)" stroke="var(--band-edge)" stroke-width="1"/>
    <path d="M74.5,85 C68.5,50.2 100.6,19.5 150,19.5 C199.4,19.5 231.5,50.2 225.5,85" stroke="#ffffff" stroke-opacity=".3" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    <path d="M83.5,85 C83.5,52.4 109,30 150,30 C191,30 216.5,52.4 216.5,85" stroke="#000000" stroke-opacity=".18" stroke-width="1" fill="none"/>
    <path d="M96,51.2 C116.5,31.8 132.2,28 150,28 C167.8,28 183.5,31.8 204,51.2 C183.5,35 166.2,40 150,40 C133.8,40 116.5,35 96,51.2 Z" fill="url(#padV)" stroke="var(--cushion-edge)" stroke-width=".8"/>
    <path d="M112.2,44.2 C125.7,31.5 139.2,31 150,31 C160.8,31 174.3,31.5 187.8,44.2" stroke="#ffffff" stroke-opacity=".16" stroke-width="1" fill="none" stroke-linecap="round"/>

    <use href="#side"/>
    <use href="#side" transform="translate(300,0) scale(-1,1)"/>
  </g>
</svg>
