      --band-hi: #5f6063;
      --band: #1a1c20;
      --band-lo: #0e0f12;
      --band-edge: #7a7b7e;
      --cup-hi: #626467;
      --cup: #1f2126;
      --cup-lo: #111215;
      --cup-edge: #7d7e81;
      --cushion-hi: #4c4c4f;
      --cushion: #131417;
      --cushion-lo: #0a0b0d;
      --cushion-edge: #767778;
      --metal-lo: #3d4046;
      --metal-mid: #6f7480;
      --metal-hi: #bec0c6;
