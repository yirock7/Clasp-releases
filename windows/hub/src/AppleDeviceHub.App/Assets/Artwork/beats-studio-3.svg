      --band-edge: #838486;
      --cup-hi: #6c6d6f;
      --cup: #2d2e31;
      --cup-lo: #19191b;
      --cup-edge: #858688;
      --cushion-hi: #545556;
      --cushion: #1e1f21;
      --cushion-lo: #101112;
      --cushion-edge: #7c7d7e;
      --metal-lo: #4e5054;
      --metal-mid: #8e9299;
      --metal-hi: #ccced1;
      --metal-edge: #5c5f63;
      --sheen: #ffffff;
    }
    svg[data-colorway="matte-black"] {
    }
    svg[data-colorway="white"] {
      --band-hi: #f5f5f5;
      --band: #ececed;
      --band-lo: #b8b8b9;
      --band-edge: #929293;
      --cup-hi: #f7f7f7;
      --cup: #f0f0f1;
      --cup-lo: #bbbbbc;
      --cup-edge: #959595;
      --cushion-hi: #eaeaeb;
      --cushion: #dededf;
      --cushion-lo: #adadae;
      --cushion-edge: #8a8a8a;
      --metal-lo: #6e7072;
      --metal-mid: #c8cbd0;
      --metal-hi: #e6e8ea;
      --metal-edge: #828487;
    }
    svg[data-colorway="red"] {
      --band-hi: #d15966;
      --band: #bd1224;
      --band-lo: #680a14;
      --band-edge: #d97680;
      --cup-hi: #da6774;
      --cup: #c61529;
      --cup-lo: #8b0f1d;
      --cup-edge: #6d0c17;
      --cushion-hi: #aa4853;
      --cushion: #8f0e1d;
      --cushion-lo: #4f0810;
      --cushion-edge: #be737c;
