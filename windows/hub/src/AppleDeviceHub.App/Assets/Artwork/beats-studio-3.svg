  <defs>
    <linearGradient id="bandV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--band-hi)"/>
      <stop offset=".4" stop-color="var(--band)"/>
      <stop offset="1" stop-color="var(--band-lo)"/>
    </linearGradient>
    <linearGradient id="padV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--cushion-lo)"/>
      <stop offset=".6" stop-color="var(--cushion)"/>
      <stop offset="1" stop-color="var(--cushion-hi)"/>
    </linearGradient>
    <linearGradient id="cupH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--cup-lo)"/>
      <stop offset=".28" stop-color="var(--cup-hi)"/>
      <stop offset=".62" stop-color="var(--cup)"/>
      <stop offset="1" stop-color="var(--cup-lo)"/>
    </linearGradient>
    <linearGradient id="cushH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--cushion-lo)"/>
      <stop offset=".5" stop-color="var(--cushion)"/>
      <stop offset="1" stop-color="var(--cushion-hi)"/>
    </linearGradient>
    <linearGradient id="metalH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--metal-lo)"/>
      <stop offset=".3" stop-color="var(--metal-hi)"/>
      <stop offset=".65" stop-color="var(--metal-mid)"/>
      <stop offset="1" stop-color="var(--metal-lo)"/>
    </linearGradient>
    <linearGradient id="cupShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".22"/>
    </linearGradient>
    <radialGradient id="shadowSoft" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000000" stop-opacity=".3"/>
      <stop offset=".5" stop-color="#000000" stop-opacity=".18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <g id="side">
      <g transform="rotate(-4 79 155)">
        <path d="M90.5,109.5 L98,109.5 C103.5,109.5 108,114 108,119.5 L108,190.5 C108,196 103.5,200.5 98,200.5 L90.5,200.5 C89.7,200.5 89,199.8 89,199 L89,111 C89,110.2 89.7,109.5 90.5,109.5 Z" fill="url(#cushH)" stroke="var(--cushion-edge)" stroke-width=".9"/>
        <path d="M105.7,118.5 C106.7,131.5 106.7,178.5 105.7,191.5" stroke="#ffffff" stroke-opacity=".22" stroke-width="1.3" fill="none" stroke-linecap="round"/>
        <path d="M77,106 L88,106 C89.1,106 90,106.9 90,108 L90,202 C90,203.1 89.1,204 88,204 L77,204 C68.8,204 62,197.2 62,189 L62,121 C62,112.8 68.8,106 77,106 Z" fill="url(#cupH)" stroke="var(--cup-edge)" stroke-width=".9"/>
        <path d="M77,106 L88,106 C89.1,106 90,106.9 90,108 L90,202 C90,203.1 89.1,204 88,204 L77,204 C68.8,204 62,197.2 62,189 L62,121 C62,112.8 68.8,106 77,106 Z" fill="url(#cupShade)"/>
        <path d="M66.2,122 C65.6,138 65.6,172 66.2,188" stroke="#ffffff" stroke-opacity=".5" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <path d="M71,107.8 L85,107.8" stroke="#ffffff" stroke-opacity=".28" stroke-width="1" fill="none" stroke-linecap="round"/>
        <path d="M90,108 L90,202" stroke="#000000" stroke-opacity=".3" stroke-width="1" fill="none"/>
        <path d="M91.2,110 L91.2,200" stroke="#ffffff" stroke-opacity=".18" stroke-width=".8" fill="none"/>
      </g>
      <rect x="71" y="92" width="12" height="15" rx="2" fill="url(#metalH)" stroke="var(--metal-edge)" stroke-width=".8"/>
      <path d="M69.5,105 C69.5,100 72,98 76,98 L84,98 C88,98 90.5,100 90.5,105 L91,117 C91,122.5 88,125 84,125 L76,125 C72,125 69,122.5 69.5,117 Z" fill="url(#bandV)" stroke="var(--band-edge)" stroke-width=".9"/>
      <path d="M73,102 C76.5,101 83,101 87,102" stroke="#ffffff" stroke-opacity=".4" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <circle cx="80" cy="115" r="3.2" fill="url(#metalH)" stroke="var(--metal-edge)" stroke-width=".7"/>
      <rect x="68" y="88" width="19" height="8.5" rx="3.5" fill="url(#bandV)" stroke="var(--band-edge)" stroke-width=".8"/>
    </g>
  </defs>

  <g data-part="shadow">
    <ellipse cx="150" cy="207" rx="108" ry="12" fill="url(#shadowSoft)"/>
  </g>

  <g data-part="body">
    <path d="M70,98 C64,48.8 96.6,16 150,16 C203.4,16 236,48.8 230,98 L216,98 C216,55.8 194,31 150,31 C106,31 84,55.8 84,98 Z" fill="url(#bandV)" stroke="var(--band-edge)" stroke-width="1"/>
    <path d="M73,89 C67,51.8 99.6,19.5 150,19.5 C200.4,19.5 233,51.8 227,89" stroke="#ffffff" stroke-opacity=".34" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    <path d="M85,89 C85,55.8 110,33 150,33 C190,33 215,55.8 215,89" stroke="#000000" stroke-opacity=".18" stroke-width="1" fill="none"/>
    <path d="M98,53.4 C117.8,34.6 132.8,31 150,31 C167.2,31 182.2,34.6 202,53.4 C182.2,39 165.6,44 150,44 C134.4,44 117.8,39 98,53.4 Z" fill="url(#padV)" stroke="var(--cushion-edge)" stroke-width=".8"/>
    <path d="M113.6,46.6 C126.6,34.5 139.6,34 150,34 C160.4,34 173.4,34.5 186.4,46.6" stroke="#ffffff" stroke-opacity=".16" stroke-width="1" fill="none" stroke-linecap="round"/>

    <use href="#side"/>
    <use href="#side" transform="translate(300,0) scale(-1,1)"/>
  </g>
</svg>
