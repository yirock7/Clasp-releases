    svg[data-colorway="blue"] {
      --band-hi: #7897ba;
      --band: #2f5f95;
      --band-lo: #214268;
      --band-edge: #1a3452;
      --cup-hi: #7c9ec3;
      --cup: #356aa3;
      --cup-lo: #254a72;
      --cup-edge: #1d3a5a;
      --cushion-hi: #617d9e;
      --cushion: #244b78;
      --cushion-lo: #193454;
      --cushion-edge: #142942;
      --metal-lo: #566474;
      --metal-mid: #9db6d2;
      --metal-hi: #d3deeb;
      --metal-edge: #667688;
