      --band: #b3131f;
      --band-lo: #620a11;
      --band-edge: #d3767d;
      --cup-hi: #646466;
      --cup: #212225;
      --cup-lo: #121314;
      --cup-edge: #7e7f81;
      --cushion-hi: #4f4f51;
      --cushion: #17181a;
      --cushion-lo: #0d0d0e;
      --cushion-edge: #78797a;
      --metal-lo: #4f5155;
      --metal-mid: #8f939a;
      --metal-hi: #cdced2;
      --metal-edge: #5d6064;
    }
