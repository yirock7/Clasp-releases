<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 230">
  <style>
    svg {
      --body-hi: #54555c;
      --body: #2c2d31;
      --body-lo: #131416;
      --edge: #08080a;
      --rim-fill: #34353a;
      --cavity-top: #08080a;
      --cavity-bottom: #2c2d31;
      --lid-shade: #202024;
      --lid-shade-right: #1e1f22;
      --lid-mid: #28292d;
      --lid-hi: #2c2d31;
      --inside-hi: #3a3b40;
      --inside-lo: #17181a;
      --bud-hi: #5c5d64;
      --bud: #2c2d31;
      --bud-lo: #141517;
      --bud-edge: #060607;
      --face-hi: #66676f;
      --face: #323338;
      --face-edge: #0a0a0b;
      --paddle-hi: #f6dfa4;
      --paddle: #d3ab57;
      --paddle-lo: #96701f;
      --paddle-edge: #6a4b10;
      --tip: #26272a;
      --tip-in: #3f4045;
      --spec: #c3c4cc;
      --hinge-hi: #f1d690;
      --hinge: #cba550;
      --hinge-lo: #8a6a24;
      --hinge-edge: #66490f;
      --lip: #64666d;
      --board: #00000000;
      --battery: #00000000;
      --contact: #00000000;
      --trace: #00000000;
      --light: #ffffff;
      --light-core: #ffffff;
    }
    svg[data-colorway="black-gold"] {
    }
    svg[data-colorway="ivory"] {
      --body-hi: #fbf8f1;
      --body: #ece5d6;
      --body-lo: #cfc6b2;
      --edge: #b3a98f;
      --rim-fill: #efe9db;
      --cavity-top: #8a8371;
      --cavity-bottom: #cdc5b1;
      --lid-shade: #ded6c4;
      --lid-shade-right: #dcd4c2;
      --lid-mid: #e8e0d1;
      --lid-hi: #ece5d6;
      --inside-hi: #e6dfcf;
      --inside-lo: #b9af97;
      --bud-hi: #fffdf8;
      --bud: #efe8d9;
      --bud-lo: #cbc1ab;
      --bud-edge: #aea388;
      --face-hi: #fffdf8;
      --face: #f0eadc;
      --face-edge: #b9ae94;
      --paddle-hi: #f4e3b4;
      --paddle: #d9b968;
      --paddle-lo: #a88533;
      --paddle-edge: #7c5f1c;
      --tip: #e6dfcf;
      --tip-in: #f6f1e5;
      --spec: #ffffff;
      --hinge-hi: #f6e6b8;
      --hinge: #d4b262;
      --hinge-lo: #a07f2f;
      --hinge-edge: #7c5f1c;
      --lip: #fffdf8;
    }
    svg[data-colorway="transparent"] {
      --body-hi: #d6dce4a0;
      --body: #8f969f8c;
      --body-lo: #5b626b96;
      --edge: #5f666f;
      --rim-fill: #b3bac3b0;
      --cavity-top: #20242a;
      --cavity-bottom: #555b63;
      --lid-shade: #4a5159;
      --lid-shade-right: #454b53;
      --lid-mid: #5f666f;
      --lid-hi: #737a84;
      --inside-hi: #848c96;
      --inside-lo: #4e555d;
      --bud-hi: #a5adb7;
      --bud: #656c75;
      --bud-lo: #3a4048;
      --bud-edge: #2a2f35;
      --face-hi: #878f99;
      --face: #3c4249;
      --face-edge: #23272c;
      --paddle-hi: #f1f3f6;
      --paddle: #c8ccd3;
      --paddle-lo: #8b929c;
      --paddle-edge: #5b626b;
      --tip: #aab1ba;
      --tip-in: #cfd4db;
      --spec: #f4f6f9;
      --hinge-hi: #e4e8ee;
      --hinge: #aab0b9;
      --hinge-lo: #707781;
      --hinge-edge: #4c525b;
      --lip: #e6eaef;
      --board: #3f444cb0;
      --battery: #1b1e22c8;
      --contact: #d2ab55e0;
      --trace: #c9a24f99;
    }
    svg[data-colorway="cosmic-silver"] {
      --body-hi: #f6f7f9;
      --body: #d9dce1;
      --body-lo: #aeb3bb;
      --edge: #8b919b;
      --rim-fill: #e3e6ea;
      --cavity-top: #6d727b;
      --cavity-bottom: #b9bec6;
      --lid-shade: #c4c8ce;
      --lid-shade-right: #c1c5cc;
      --lid-mid: #d3d6db;
      --lid-hi: #d9dce1;
      --inside-hi: #d5d8de;
      --inside-lo: #9ba1aa;
      --bud-hi: #fafbfc;
      --bud: #d6d9de;
      --bud-lo: #a4a9b2;
      --bud-edge: #858b95;
      --face-hi: #f4f5f7;
      --face: #cfd3d9;
      --face-edge: #8d939d;
      --paddle-hi: #f9fafb;
      --paddle: #c3c7ce;
      --paddle-lo: #8a909a;
      --paddle-edge: #666c76;
      --tip: #5c6068;
      --tip-in: #7a7e87;
      --spec: #ffffff;
      --hinge-hi: #f4f6f9;
      --hinge: #b9bec7;
      --hinge-lo: #7f8590;
      --hinge-edge: #5f656f;
      --lip: #fbfcfd;
    }
    svg[data-colorway="cosmic-pink"] {
      --body-hi: #fbe6e3;
      --body: #eec3bf;
      --body-lo: #cf9a98;
      --edge: #ae7b7b;
      --rim-fill: #f2cdc9;
      --cavity-top: #8d5f5f;
      --cavity-bottom: #d1a3a1;
      --lid-shade: #deaeac;
      --lid-shade-right: #ddacaa;
      --lid-mid: #e9bdb9;
      --lid-hi: #eec3bf;
      --inside-hi: #eac0bc;
      --inside-lo: #b98383;
      --bud-hi: #fdeeec;
      --bud: #ebbdb9;
      --bud-lo: #c18f8d;
      --bud-edge: #a67373;
      --face-hi: #fbe3e0;
      --face: #e9b8b4;
      --face-edge: #a97878;
      --paddle-hi: #fcece9;
      --paddle: #dcaaa6;
      --paddle-lo: #b07d7b;
      --paddle-edge: #8a5c5c;
      --tip: #7a5b5d;
      --tip-in: #98797b;
      --spec: #fff6f4;
      --hinge-hi: #fbe4e0;
      --hinge: #d6a5a2;
      --hinge-lo: #a87876;
      --hinge-edge: #825656;
      --lip: #fff4f2;
    }
  </style>

  <defs>
    <linearGradient id="bodyEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity=".18"/>
      <stop offset=".16" stop-color="#000000" stop-opacity="0"/>
      <stop offset=".84" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="wBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--body-hi)"/>
      <stop offset=".55" stop-color="var(--body)"/>
      <stop offset="1" stop-color="var(--body-lo)"/>
    </linearGradient>
    <radialGradient id="budTop" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="var(--bud-hi)"/>
      <stop offset=".65" stop-color="var(--bud)"/>
      <stop offset="1" stop-color="var(--bud-lo)"/>
    </radialGradient>
    <radialGradient id="budFace" cx=".38" cy=".32" r=".85">
      <stop offset="0" stop-color="var(--face-hi)"/>
      <stop offset="1" stop-color="var(--face)"/>
    </radialGradient>
    <linearGradient id="paddle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--paddle-hi)"/>
      <stop offset=".5" stop-color="var(--paddle)"/>
      <stop offset="1" stop-color="var(--paddle-lo)"/>
    </linearGradient>
    <linearGradient id="hinge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--hinge-lo)"/>
      <stop offset=".35" stop-color="var(--hinge-hi)"/>
      <stop offset=".65" stop-color="var(--hinge)"/>
      <stop offset="1" stop-color="var(--hinge-lo)"/>
    </linearGradient>
    <linearGradient id="cavity" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--cavity-top)"/>
      <stop offset="1" stop-color="var(--cavity-bottom)"/>
    </linearGradient>
    <linearGradient id="lidSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--lid-shade)"/>
      <stop offset=".16" stop-color="var(--lid-mid)"/>
      <stop offset=".5" stop-color="var(--lid-hi)"/>
      <stop offset=".84" stop-color="var(--lid-mid)"/>
      <stop offset="1" stop-color="var(--lid-shade-right)"/>
    </linearGradient>
    <linearGradient id="lidIn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--inside-hi)"/>
      <stop offset="1" stop-color="var(--inside-lo)"/>
    </linearGradient>
    <radialGradient id="shadowSoft" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000000" stop-opacity=".26"/>
      <stop offset=".5" stop-color="#000000" stop-opacity=".16"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glossSoft" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lightGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="var(--light)" stop-opacity=".55"/>
      <stop offset=".45" stop-color="var(--light)" stop-opacity=".3"/>
      <stop offset="1" stop-color="var(--light)" stop-opacity="0"/>
    </radialGradient>

    <!-- The tray and lid are drawn in plan view (2.11 px per mm of floor space) and squashed by sin(36 degrees) = 0.588. Plan y 0 is the hinge. -->
    <!-- One stemless bud (left): smooth shell, silicone tip toward the middle, flat pill-shaped paddle on the outer face. -->
    <g id="sbBud">
      <g transform="translate(5 113) scale(1 0.588)">
        <ellipse cx="114" cy="60" rx="34" ry="36" fill="#000000" fill-opacity=".2"/>
        <ellipse cx="136" cy="66" rx="6.5" ry="9.5" fill="var(--tip)" stroke="var(--bud-edge)" transform="translate(0 4) rotate(-62 136 66)"/>
        <ellipse cx="136" cy="66" rx="6.5" ry="9.5" fill="var(--tip)" stroke="var(--bud-edge)" transform="rotate(-62 136 66)"/>
        <ellipse cx="138" cy="67" rx="3.2" ry="5.6" fill="var(--tip-in)" transform="rotate(-62 138 67)"/>
        <ellipse cx="108" cy="52" rx="21" ry="28" fill="var(--bud-lo)" stroke="var(--bud-edge)" transform="translate(0 8) rotate(-62 108 52)"/>
        <ellipse cx="108" cy="52" rx="21" ry="28" fill="var(--bud-lo)" transform="translate(0 4) rotate(-62 108 52)"/>
        <ellipse cx="108" cy="52" rx="21" ry="28" fill="url(#budTop)" stroke="var(--bud-edge)" transform="rotate(-62 108 52)"/>
        <rect x="94" y="46" width="28" height="12" rx="6" fill="url(#paddle)" stroke="var(--paddle-edge)" stroke-width=".8" transform="rotate(28 108 52)"/>
        <path d="M97,50 C101,47 108,46.4 115,47" stroke="var(--spec)" stroke-opacity=".7" stroke-width="1.3" stroke-linecap="round" fill="none" transform="rotate(28 108 52)"/>
        <path d="M89,44 C91,35 99,30 110,29" stroke="var(--spec)" stroke-opacity=".8" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      </g>
    </g>
    <!-- Moulded well under each bud (the tray) -->
    <g id="sbWell">
      <g transform="translate(5 113) scale(1 0.588)" opacity=".3">
        <ellipse cx="110" cy="54" rx="25" ry="32" fill="#000000" transform="rotate(-62 110 54)"/>
        <ellipse cx="137" cy="67" rx="9" ry="12" fill="#000000" transform="rotate(-62 137 67)"/>
      </g>
    </g>
  </defs>

  <g data-part="shadow">
    <ellipse cx="150" cy="204" rx="100" ry="15" fill="url(#shadowSoft)"/>
  </g>

  <!-- The open lid is painted here, behind the buds. Its inside face is in rim-local coordinates (y 0 at the hinge). -->
  <g data-part="lid" data-lid="x=74;width=152;depth=63;rx=56;ry=31.5;hingeY=113;height=21;tilt=36;open=100;domeRadius=18;shine=0.12" data-side-fill="url(#lidSide)" data-rim-stroke="var(--edge)">
    <g transform="scale(1 0.588)">
      <rect x="80" y="8.5" width="140" height="90" rx="50" ry="45" fill="url(#lidIn)"/>
    </g>
    <rect x="124" y="55" width="52" height="2.2" rx="1.1" fill="#ffffff" opacity=".45"/>
  </g>

  <g data-part="body">
    <!-- hinge barrel on the back rim -->
    <rect x="124" y="109" width="52" height="8" rx="4" fill="url(#hinge)" stroke="var(--hinge-edge)" stroke-width=".8"/>
    <path d="M137,109 L137,117 M163,109 L163,117" stroke="var(--hinge-edge)" stroke-width=".9" fill="none"/>
    <path d="M127,111.5 L173,111.5" stroke="#ffffff" stroke-opacity=".6" stroke-width="1" fill="none"/>
    <path d="M74,144.5 L74,170.5 A56,31.5 0 0 0 130,202 L170,202 A56,31.5 0 0 0 226,170.5 L226,144.5 A56,31.5 0 0 1 170,176 L130,176 A56,31.5 0 0 1 74,144.5 Z" fill="url(#wBody)" stroke="var(--edge)"/>
    <!-- battery and board, visible only through the transparent shell -->
    <rect x="112" y="181" width="76" height="14" rx="4" fill="var(--board)"/>
    <rect x="124" y="184" width="52" height="9" rx="3" fill="var(--battery)"/>
    <rect x="113" y="184" width="6" height="8" rx="2" fill="var(--contact)"/>
    <rect x="181" y="184" width="6" height="8" rx="2" fill="var(--contact)"/>
    <path d="M136,193 L136,198 M150,193 L150,199 M164,193 L164,198" stroke="var(--trace)" stroke-width="1.4" fill="none"/>
    <path d="M74,144.5 L74,170.5 A56,31.5 0 0 0 130,202 L170,202 A56,31.5 0 0 0 226,170.5 L226,144.5 A56,31.5 0 0 1 170,176 L130,176 A56,31.5 0 0 1 74,144.5 Z" fill="url(#bodyEdge)"/>
    <ellipse cx="150" cy="188" rx="62" ry="8" fill="url(#glossSoft)"/>
    <rect x="74" y="113" width="152" height="63" rx="56" ry="31.5" fill="var(--rim-fill)" stroke="var(--edge)"/>
    <g transform="translate(0 113) scale(1 0.588)">
      <rect x="80" y="8.5" width="140" height="90" rx="50" ry="45" fill="url(#cavity)"/>
    </g>
    <use href="#sbWell"/>
    <use href="#sbWell" transform="translate(300,0) scale(-1,1)"/>
  </g>

  <g data-part="buds">
    <g data-part="bud-left"><use href="#sbBud"/></g>
    <g data-part="bud-right"><use href="#sbBud" transform="translate(300,0) scale(-1,1)"/></g>
  </g>

  <!-- Front lip: repaints the front part of the rim so the buds look seated inside the case. -->
  <g id="front-lip">
    <path d="M74,144.5 A56,31.5 0 0 0 130,176 L170,176 A56,31.5 0 0 0 226,144.5 L220,144.5 A50,26.5 0 0 1 170,170.9 L130,170.9 A50,26.5 0 0 1 80,144.5 Z" fill="var(--rim-fill)"/>
    <path d="M74,144.5 A56,31.5 0 0 0 130,176 L170,176 A56,31.5 0 0 0 226,144.5" fill="none" stroke="var(--edge)"/>
    <path d="M86,153 C94,162 108,168.5 126,171.5 L174,171.5 C192,168.5 206,162 214,153" stroke="var(--lip)" stroke-width="1.8" fill="none"/>
  </g>

  <g data-part="light">
    <ellipse cx="150" cy="190" rx="9" ry="9" fill="url(#lightGlow)"/>
    <circle cx="150" cy="190" r="2.1" fill="var(--light-core)"/>
  </g>
</svg>
