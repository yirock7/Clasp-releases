<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 230">
  <style>
    svg {
      --body-hi: #ffffff;
      --body: #f1f2f5;
      --body-lo: #d9dce3;
      --edge: #c2c6ce;
      --rim-fill: #eef0f3;
      --cavity-top: #8b9099;
      --cavity-bottom: #cfd2d8;
      --lid-shade: #cfd3da;
      --lid-shade-right: #cbcfd7;
      --lid-mid: #f4f5f8;
      --inside-hi: #e3e5ea;
      --inside-lo: #b4b8c1;
      --bud-hi: #ffffff;
      --bud: #eceef2;
      --bud-lo: #cfd3da;
      --bud-edge: #bfc3cb;
      --bud-ear: #f1f2f5;
      --bud-ear-in: #d3d6dc;
      --mesh-hi: #55585f;
      --mesh-lo: #121316;
      --metal-lo: #8b94a1;
      --metal-mid: #c3c9d2;
      --metal-hi: #f4f6f9;
      --metal-tip: #9aa3af;
      --lip: #f7f8fa;
      --light: #34c759;
      --light-core: #3ddc66;
    }
    svg[data-colorway="white"] {
    }
  </style>

  <defs>
    <linearGradient id="bodyEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity=".16"/>
      <stop offset=".18" stop-color="#000000" stop-opacity="0"/>
      <stop offset=".82" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".2"/>
    </linearGradient>
    <radialGradient id="mesh" cx=".4" cy=".35" r=".8">
      <stop offset="0" stop-color="var(--mesh-hi)"/>
      <stop offset="1" stop-color="var(--mesh-lo)"/>
    </radialGradient>
    <linearGradient id="wBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--body-hi)"/>
      <stop offset=".6" stop-color="var(--body)"/>
      <stop offset="1" stop-color="var(--body-lo)"/>
    </linearGradient>
    <radialGradient id="wBud" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="var(--bud-hi)"/>
      <stop offset=".7" stop-color="var(--bud)"/>
      <stop offset="1" stop-color="var(--bud-lo)"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--metal-tip)"/>
      <stop offset=".35" stop-color="var(--metal-hi)"/>
      <stop offset=".6" stop-color="var(--metal-mid)"/>
      <stop offset="1" stop-color="var(--metal-lo)"/>
    </linearGradient>
    <linearGradient id="cavity" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--cavity-top)"/>
      <stop offset="1" stop-color="var(--cavity-bottom)"/>
    </linearGradient>
    <linearGradient id="lidSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--lid-shade)"/>
      <stop offset=".16" stop-color="var(--lid-mid)"/>
      <stop offset=".5" stop-color="var(--body-hi)"/>
      <stop offset=".84" stop-color="var(--lid-mid)"/>
      <stop offset="1" stop-color="var(--lid-shade-right)"/>
    </linearGradient>
    <linearGradient id="lidIn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--inside-hi)"/>
      <stop offset="1" stop-color="var(--inside-lo)"/>
    </linearGradient>
    <!-- Soft shapes that replace blur filters: fade to nothing at the edge. -->
    <radialGradient id="shadowSoft" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000000" stop-opacity=".26"/>
      <stop offset=".5" stop-color="#000000" stop-opacity=".16"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glossSoft" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lightGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="var(--light)" stop-opacity=".55"/>
      <stop offset=".45" stop-color="var(--light)" stop-opacity=".3"/>
      <stop offset="1" stop-color="var(--light)" stop-opacity="0"/>
    </radialGradient>

    <!-- One earbud (left); the right one is this mirrored. Drawn unclipped: the front lip below hides the stem inside the case. -->
    <g id="apBud">
      <g transform="rotate(-7 116 117)">
        <rect x="110.5" y="107" width="11" height="20" rx="5.5" fill="url(#wBud)" stroke="var(--bud-edge)"/>
        <path d="M116.0,78.5 C124.0,78.5 128.5,84.0 128.5,91.5 C128.5,99.0 124.0,104.0 121.5,109.0 C120.6,111.0 120.5,113.0 120.5,115.0 L110.5,115.0 C110.5,112.0 110.2,109.5 108.5,106.5 C105.5,101.5 103.0,97.0 103.0,91.5 C103.0,84.0 108.0,78.5 116.0,78.5 Z" fill="url(#wBud)" stroke="var(--bud-edge)"/>
        <path d="M128.5,91.5 C128.5,99.0 124.0,104.0 121.5,109.0 C120.6,111.0 120.5,113.0 120.5,115.0 L117.0,115.0 C117.5,111.0 119.0,106.0 122.0,101.0 C124.5,97.0 125.5,93.0 125.0,88.0 C126.8,88.8 128.5,89.5 128.5,91.5 Z" fill="var(--bud-lo)" opacity=".4"/>
        <rect x="117.4" y="82" width="3.2" height="10" rx="1.6" fill="url(#mesh)" transform="rotate(16 119 87)"/>
        <path d="M106.5,87.0 C107.5,82.5 111.0,80.4 115.5,80.2" stroke="#ffffff" stroke-opacity=".9" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M105.4,93.0 C105.2,91.5 105.3,90.6 105.6,89.8" stroke="#ffffff" stroke-opacity=".55" stroke-width="1.1" fill="none" stroke-linecap="round"/>
      </g>
    </g>
  </defs>

  <g data-part="shadow">
    <ellipse cx="150" cy="208" rx="85.8" ry="17.9" fill="url(#shadowSoft)"/>
  </g>

  <!-- The open lid is painted here, behind the buds. Its inside face is in rim-local coordinates (y 0 at the hinge). -->
  <g data-part="lid" data-lid="x=85;width=130;depth=25;rx=24;ry=12.5;hingeY=105;height=34;tilt=30;open=104;domeRadius=21.6" data-side-fill="url(#lidSide)" data-rim-stroke="var(--edge)">
    <rect x="93" y="3.5" width="114" height="18" rx="18" ry="9" fill="url(#lidIn)"/>
    <ellipse cx="116" cy="12" rx="18.5" ry="7" fill="#000000" opacity=".08"/>
    <ellipse cx="184" cy="12" rx="18.5" ry="7" fill="#000000" opacity=".08"/>
    <rect x="132" y="20" width="36" height="2.2" rx="1.1" fill="#ffffff" opacity=".7"/>
  </g>

  <g data-part="body">
    <!-- hinge barrel on the back rim: two body knuckles and the lid knuckle between them -->
    <rect x="130" y="100.5" width="40" height="8" rx="4" fill="url(#metal)" stroke="#8a929d" stroke-width=".8"/>
    <path d="M138,100.5 L138,108.5 M162,100.5 L162,108.5" stroke="#6f7884" stroke-width=".9" fill="none"/>
    <path d="M132,103 L168,103" stroke="#ffffff" stroke-opacity=".7" stroke-width="1" fill="none"/>
    <path d="M85,117.5 L85,177 C85,190.81 97.54,202 113,202 L187,202 C202.46,202 215,190.81 215,177 L215,117.5 A24,12.5 0 0 1 191,130 L109,130 A24,12.5 0 0 1 85,117.5 Z" fill="url(#wBody)" stroke="var(--edge)"/>
    <path d="M85,117.5 L85,177 C85,190.81 97.54,202 113,202 L187,202 C202.46,202 215,190.81 215,177 L215,117.5 A24,12.5 0 0 1 191,130 L109,130 A24,12.5 0 0 1 85,117.5 Z" fill="url(#bodyEdge)"/>
    <ellipse cx="150" cy="150.16" rx="55.9" ry="12.24" fill="url(#glossSoft)"/>
    <rect x="85" y="105" width="130" height="25" rx="24" ry="12.5" fill="var(--rim-fill)" stroke="var(--edge)"/>
    <rect x="94" y="109" width="112" height="17" rx="18" ry="8.5" fill="url(#cavity)"/>
  </g>

  <g data-part="buds">
    <g data-part="bud-left"><use href="#apBud"/></g>
    <g data-part="bud-right"><use href="#apBud" transform="translate(300,0) scale(-1,1)"/></g>
  </g>

  <!-- Front lip: repaints the part of the rim in front of the cavity so the bud stems look hidden inside the case. -->
  <g id="front-lip">
    <path d="M85,117.5 A24,12.5 0 0 0 109,130 L191,130 A24,12.5 0 0 0 215,117.5 L206,117.5 A18,8.5 0 0 1 188,126 L112,126 A18,8.5 0 0 1 94,117.5 Z" fill="var(--rim-fill)"/>
    <path d="M85,117.5 A24,12.5 0 0 0 109,130 L191,130 A24,12.5 0 0 0 215,117.5" fill="none" stroke="var(--edge)"/>
    <path d="M92.2,126.5 C100.6,129.5 106.6,129.8 109,129.8 L191,129.8 C193.4,129.8 199.4,129.5 207.8,126.5" stroke="var(--lip)" stroke-width="2" fill="none"/>
  </g>

  <g data-part="light">
    <ellipse cx="150" cy="151.6" rx="10" ry="10" fill="url(#lightGlow)"/>
    <circle cx="150" cy="151.6" r="2.3" fill="var(--light-core)"/>
  </g>
</svg>
