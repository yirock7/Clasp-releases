  <defs>
    <linearGradient id="bandV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--band-hi)"/>
      <stop offset=".4" stop-color="var(--band)"/>
      <stop offset="1" stop-color="var(--band-lo)"/>
    </linearGradient>
    <linearGradient id="padV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--cushion-lo)"/>
      <stop offset=".6" stop-color="var(--cushion)"/>
      <stop offset="1" stop-color="var(--cushion-hi)"/>
    </linearGradient>
    <linearGradient id="cupH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--cup-lo)"/>
      <stop offset=".28" stop-color="var(--cup-hi)"/>
      <stop offset=".62" stop-color="var(--cup)"/>
      <stop offset="1" stop-color="var(--cup-lo)"/>
    </linearGradient>
    <linearGradient id="cushH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--cushion-lo)"/>
      <stop offset=".5" stop-color="var(--cushion)"/>
      <stop offset="1" stop-color="var(--cushion-hi)"/>
    </linearGradient>
    <linearGradient id="metalH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--metal-lo)"/>
      <stop offset=".3" stop-color="var(--metal-hi)"/>
      <stop offset=".65" stop-color="var(--metal-mid)"/>
      <stop offset="1" stop-color="var(--metal-lo)"/>
    </linearGradient>
    <linearGradient id="cupShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".22"/>
    </linearGradient>
    <radialGradient id="shadowSoft" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000000" stop-opacity=".3"/>
      <stop offset=".5" stop-color="#000000" stop-opacity=".18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <g id="side">
      <g transform="rotate(-5 84 165.5)">
        <path d="M94.5,133 L99.5,133 C103.3,133 106.5,136.2 106.5,140 L106.5,191 C106.5,194.8 103.3,198 99.5,198 L94.5,198 C93.7,198 93,197.3 93,196.5 L93,134.5 C93,133.7 93.7,133 94.5,133 Z" fill="url(#cushH)" stroke="var(--cushion-edge)" stroke-width=".9"/>
        <path d="M104.2,142 C105.2,155 105.2,176 104.2,189" stroke="#ffffff" stroke-opacity=".22" stroke-width="1.3" fill="none" stroke-linecap="round"/>
        <path d="M80,127 L92,127 C93.1,127 94,127.9 94,129 L94,202 C94,203.1 93.1,204 92,204 L80,204 C73.4,204 68,198.6 68,192 L68,139 C68,132.4 73.4,127 80,127 Z" fill="url(#cupH)" stroke="var(--cup-edge)" stroke-width=".9"/>
        <path d="M80,127 L92,127 C93.1,127 94,127.9 94,129 L94,202 C94,203.1 93.1,204 92,204 L80,204 C73.4,204 68,198.6 68,192 L68,139 C68,132.4 73.4,127 80,127 Z" fill="url(#cupShade)"/>
        <path d="M72.2,140 C71.6,156 71.6,175 72.2,191" stroke="#ffffff" stroke-opacity=".55" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <path d="M75.2,128.8 L89,128.8" stroke="#ffffff" stroke-opacity=".28" stroke-width="1" fill="none" stroke-linecap="round"/>
        <path d="M94,129 L94,202" stroke="#000000" stroke-opacity=".3" stroke-width="1" fill="none"/>
        <path d="M95.2,131 L95.2,200" stroke="#ffffff" stroke-opacity=".18" stroke-width=".8" fill="none"/>
        <path d="M77,135 C77.6,157 77.6,174 77,196" stroke="#000000" stroke-opacity=".12" stroke-width="1" fill="none"/>
      </g>
      <rect x="78" y="106" width="11" height="17" rx="2" fill="url(#metalH)" stroke="var(--metal-edge)" stroke-width=".8"/>
      <path d="M73,128 C73,123.5 76,121.5 80,121.5 L90,121.5 C94,121.5 96.5,123.5 96.5,128 L97,138 C97,143 94,146 90,146 L79,146 C75,146 72.5,143 73,138 Z" fill="url(#bandV)" stroke="var(--band-edge)" stroke-width=".9"/>
      <path d="M77,125.5 C81,124.4 87,124.4 93,125.5" stroke="#ffffff" stroke-opacity=".4" stroke-width="1.1" fill="none" stroke-linecap="round"/>
      <path d="M73.5,134 L96.5,134" stroke="#000000" stroke-opacity=".28" stroke-width=".9" fill="none"/>
      <circle cx="85" cy="139.5" r="2.4" fill="url(#metalH)" stroke="var(--metal-edge)" stroke-width=".6"/>
      <rect x="75" y="113" width="19" height="9" rx="3.5" fill="url(#bandV)" stroke="var(--band-edge)" stroke-width=".8"/>
      <path d="M81,113.5 L81,121.5 M88,113.5 L88,121.5" stroke="#000000" stroke-opacity=".25" stroke-width=".7" fill="none"/>
    </g>
  </defs>

  <g data-part="shadow">
    <ellipse cx="150" cy="206" rx="98" ry="11" fill="url(#shadowSoft)"/>
  </g>

  <g data-part="body">
    <path d="M76,121 C70,60.4 100.6,20 150,20 C199.4,20 230,60.4 224,121 L211,121 C211,66.2 190.7,34 150,34 C109.3,34 89,66.2 89,121 Z" fill="url(#bandV)" stroke="var(--band-edge)" stroke-width="1"/>
    <path d="M79,112 C73,63.4 103.6,23.5 150,23.5 C196.4,23.5 227,63.4 221,112" stroke="#ffffff" stroke-opacity=".4" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    <path d="M90,112 C90,66.2 113.3,36 150,36 C186.7,36 210,66.2 210,112" stroke="#000000" stroke-opacity=".18" stroke-width="1" fill="none"/>
    <path d="M106,52.9 C122.7,37.1 135.5,34 150,34 C164.5,34 177.3,37.1 194,52.9 C177.3,40 163.2,45 150,45 C136.8,45 122.7,40 106,52.9 Z" fill="url(#padV)" stroke="var(--cushion-edge)" stroke-width=".8"/>
    <path d="M119.2,47.2 C130.2,37.5 141.2,37 150,37 C158.8,37 169.8,37.5 180.8,47.2" stroke="#ffffff" stroke-opacity=".16" stroke-width="1" fill="none" stroke-linecap="round"/>

    <use href="#side"/>
    <use href="#side" transform="translate(300,0) scale(-1,1)"/>
  </g>
</svg>
