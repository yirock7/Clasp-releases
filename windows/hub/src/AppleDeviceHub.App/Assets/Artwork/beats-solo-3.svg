<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 230">
  <style>
    svg {
      --band-hi: #626365;
      --band: #1f2023;
      --band-lo: #111213;
      --band-edge: #7d7e7f;
      --cup-hi: #656668;
      --cup: #232427;
      --cup-lo: #131415;
      --cup-edge: #7f8082;
      --cushion-hi: #4f5051;
      --cushion: #18191a;
      --cushion-lo: #0d0e0e;
      --cushion-edge: #797a7a;
      --metal-lo: #5c5e62;
      --metal-mid: #a7abb2;
      --metal-hi: #d7d9dc;
      --metal-edge: #6d6f74;
      --sheen: #ffffff;
    }
    svg[data-colorway="black"] {
    }
    svg[data-colorway="gloss-white"] {
      --band-hi: #f7f7f6;
      --band: #f1f1ef;
      --band-lo: #bcbcba;
      --band-edge: #959594;
      --cup-hi: #f9f9f8;
      --cup: #f4f4f2;
      --cup-lo: #bebebd;
      --cup-edge: #979796;
      --cushion-hi: #eeeeec;
      --cushion: #e4e4e1;
      --cushion-lo: #b2b2b0;
      --cushion-edge: #8d8d8c;
      --metal-lo: #6f7073;
      --metal-mid: #c9ccd1;
      --metal-hi: #e7e8ea;
      --metal-edge: #838588;
    }
    svg[data-colorway="silver"] {
      --band-hi: #dee0e2;
      --band: #c3c6cb;
      --band-lo: #989a9e;
      --band-edge: #797b7e;
      --cup-hi: #e1e2e5;
      --cup: #c8cbd0;
      --cup-lo: #9c9ea2;
      --cup-edge: #7c7e81;
      --cushion-hi: #c7c9cd;
      --cushion: #a8abb1;
      --cushion-lo: #83858a;
      --cushion-edge: #686a6e;
      --metal-lo: #7b7c7e;
      --metal-mid: #dfe1e5;
      --metal-hi: #f1f2f3;
      --metal-edge: #919295;
