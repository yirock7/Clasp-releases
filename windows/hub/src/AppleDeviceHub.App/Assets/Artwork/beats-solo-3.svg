    svg[data-colorway="gold"] {
      --band-hi: #e7dbc5;
      --band: #d4bd96;
      --band-lo: #a59375;
      --band-edge: #83755d;
      --cup-hi: #ebdfca;
      --cup: #dac49e;
      --cup-lo: #aa997b;
      --cup-edge: #877a62;
      --cushion-hi: #d6c7ab;
      --cushion: #bfa77c;
      --cushion-lo: #958261;
      --cushion-edge: #76684d;
      --metal-lo: #827966;
      --metal-mid: #ecdcb9;
      --metal-hi: #f6efe0;
      --metal-edge: #998f78;
    }
    svg[data-colorway="rose-gold"] {
      --band-hi: #e8d1cb;
      --band: #d6aca0;
      --band-lo: #a7867d;
      --band-edge: #856b63;
      --cup-hi: #ecd6cf;
      --cup: #dcb4a8;
      --cup-lo: #ac8c83;
      --cup-edge: #887068;
      --cushion-hi: #d6bbb3;
      --cushion: #bf9588;
      --cushion-lo: #95746a;
      --cushion-edge: #765c54;
      --metal-lo: #82726e;
      --metal-mid: #ecd0c8;
      --metal-hi: #f6eae6;
      --metal-edge: #998782;
    }
    svg[data-colorway="red"] {
      --band-hi: #d86476;
      --band: #c3112c;
      --band-lo: #880c1f;
      --band-edge: #6b0918;
      --cup-hi: #de6878;
      --cup: #cc1630;
      --cup-lo: #8f0f22;
      --cup-edge: #700c1a;
      --cushion-hi: #b44759;
      --cushion: #9c0d24;
      --cushion-lo: #560714;
      --cushion-edge: #c67380;
      --metal-lo: #77595d;
      --metal-mid: #d9a1a9;
      --metal-hi: #eed5d8;
      --metal-edge: #8d696e;
    }
    svg[data-colorway="satin-silver"] {
      --band-hi: #d2d4d7;
      --band: #aeb1b6;
      --band-lo: #888a8e;
      --band-edge: #6c6e71;
      --cup-hi: #d5d7da;
      --cup: #b3b6bb;
      --cup-lo: #8c8e92;
      --cup-edge: #6f7174;
      --cushion-hi: #aeb1b5;
      --cushion: #8f9298;
      --cushion-lo: #64666a;
      --cushion-edge: #4f5054;
      --metal-lo: #717275;
      --metal-mid: #cdd0d4;
      --metal-hi: #e8eaec;
      --metal-edge: #85878a;
    }
    svg[data-colorway="matte-black"] {
      --band-hi: #6a6a6b;
      --band: #2a2a2c;
      --band-lo: #171718;
      --band-edge: #838385;
      --cup-hi: #6d6d6e;
      --cup: #2e2e30;
      --cup-lo: #19191a;
      --cup-edge: #868687;
      --cushion-hi: #565657;
      --cushion: #202022;
      --cushion-lo: #121213;
      --cushion-edge: #7e7e7f;
      --metal-lo: #4c4e51;
      --metal-mid: #8a8d94;
      --metal-hi: #cacccf;
      --metal-edge: #5a5c60;
    }
