<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 230">
  <style>
    svg {
      --body-hi: #5a5b61;
      --body: #2e2f33;
      --body-lo: #141517;
      --edge: #09090a;
      --rim-fill: #3e3f43;
      --cavity-top: #0d0e0f;
      --cavity-bottom: #303135;
      --lid-shade: #242528;
      --lid-shade-right: #232326;
      --lid-mid: #2d2e32;
      --lid-hi: #303135;
      --inside-hi: #454649;
      --inside-lo: #1a1b1d;
      --bud-hi: #838386;
      --bud: #36373b;
      --bud-lo: #161618;
      --bud-edge: #0a0a0b;
      --face-hi: #8d8e90;
      --face: #454649;
      --face-edge: #0c0c0d;
      --tip: #1d1d20;
      --tip-in: #3f3f41;
      --spec: #d6d6d7;
      --hinge-hi: #6e6f72;
      --hinge: #3c3d41;
      --hinge-lo: #1d1d20;
      --hinge-edge: #0e0f10;
      --lip: #727376;
    }
    svg[data-colorway="matte-black"] {
    }
    svg[data-colorway="storm-gray"] {
      --body-hi: #b0b2b6;
      --body: #6f737a;
      --body-lo: #595c62;
      --edge: #484b4f;
      --rim-fill: #8f9297;
      --cavity-top: #383a3d;
      --cavity-bottom: #686c73;
      --lid-shade: #666a70;
      --lid-shade-right: #64686e;
      --lid-mid: #6d7178;
      --lid-hi: #6f737a;
      --inside-hi: #7b7e85;
      --inside-lo: #53565c;
      --bud-hi: #bec0c3;
      --bud: #73777e;
      --bud-lo: #595c62;
      --bud-edge: #434549;
      --face-hi: #c5c7ca;
      --face: #7b7e85;
      --face-edge: #45474c;
      --tip: #434549;
      --tip-in: #5f6164;
      --spec: #e2e3e4;
      --hinge-hi: #b0b2b6;
      --hinge: #6f737a;
      --hinge-lo: #53565c;
      --hinge-edge: #434549;
      --lip: #b7b9bc;
    }
    svg[data-colorway="arctic-purple"] {
      --body-hi: #d0c9e1;
      --body: #a99cc9;
      --body-lo: #877da1;
      --edge: #6e6583;
      --rim-fill: #bcb2d5;
      --cavity-top: #544e64;
      --cavity-bottom: #9f93bd;
      --lid-shade: #9b90b9;
      --lid-shade-right: #988cb5;
      --lid-mid: #a699c5;
      --lid-hi: #a99cc9;
      --inside-hi: #b0a4cd;
      --inside-lo: #7f7597;
      --bud-hi: #d8d2e7;
      --bud: #ac9fcb;
      --bud-lo: #877da1;
      --bud-edge: #655e79;
      --face-hi: #ddd7e9;
      --face: #b0a4cd;
      --face-edge: #69617d;
      --tip: #655e79;
      --tip-in: #7c768d;
      --spec: #eeebf4;
      --hinge-hi: #d0c9e1;
      --hinge: #a99cc9;
      --hinge-lo: #7f7597;
      --hinge-edge: #655e79;
      --lip: #d4cee4;
    }
    svg[data-colorway="transparent-red"] {
      --body-hi: #e8656ca0;
      --body: #c4303a8c;
      --body-lo: #7d141d96;
      --edge: #7a1a22;
      --rim-fill: #df5a62b0;
      --cavity-top: #2a0a0d;
      --cavity-bottom: #6a2329;
      --lid-shade: #8c2128;
      --lid-shade-right: #861f26;
      --lid-mid: #a6272f;
      --lid-hi: #b52d36;
      --inside-hi: #bd3a43;
      --inside-lo: #6c1a20;
      --bud-hi: #e0525a;
      --bud: #a52a32;
      --bud-lo: #5e1218;
      --bud-edge: #3c0a0e;
      --face-hi: #d8484f;
      --face: #8e1f26;
      --face-edge: #3c0a0e;
      --tip: #3a1013;
      --tip-in: #5a2226;
      --spec: #ffe3e4;
      --hinge-hi: #e87a80;
      --hinge: #b53840;
      --hinge-lo: #7d1a21;
      --hinge-edge: #5a1015;
      --lip: #f0a0a4;
    }
  </style>

  <defs>
    <linearGradient id="bodyEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity=".18"/>
      <stop offset=".16" stop-color="#000000" stop-opacity="0"/>
      <stop offset=".84" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="wBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--body-hi)"/>
      <stop offset=".55" stop-color="var(--body)"/>
      <stop offset="1" stop-color="var(--body-lo)"/>
    </linearGradient>
    <radialGradient id="budTop" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="var(--bud-hi)"/>
      <stop offset=".65" stop-color="var(--bud)"/>
      <stop offset="1" stop-color="var(--bud-lo)"/>
    </radialGradient>
    <radialGradient id="budFace" cx=".38" cy=".32" r=".85">
      <stop offset="0" stop-color="var(--face-hi)"/>
      <stop offset="1" stop-color="var(--face)"/>
    </radialGradient>
    <linearGradient id="hinge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--hinge-lo)"/>
      <stop offset=".35" stop-color="var(--hinge-hi)"/>
      <stop offset=".65" stop-color="var(--hinge)"/>
      <stop offset="1" stop-color="var(--hinge-lo)"/>
    </linearGradient>
    <linearGradient id="cavity" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--cavity-top)"/>
      <stop offset="1" stop-color="var(--cavity-bottom)"/>
    </linearGradient>
    <linearGradient id="lidSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--lid-shade)"/>
      <stop offset=".16" stop-color="var(--lid-mid)"/>
      <stop offset=".5" stop-color="var(--lid-hi)"/>
      <stop offset=".84" stop-color="var(--lid-mid)"/>
      <stop offset="1" stop-color="var(--lid-shade-right)"/>
    </linearGradient>
    <linearGradient id="lidIn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--inside-hi)"/>
      <stop offset="1" stop-color="var(--inside-lo)"/>
    </linearGradient>
    <radialGradient id="shadowSoft" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000000" stop-opacity=".26"/>
      <stop offset=".5" stop-color="#000000" stop-opacity=".16"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glossSoft" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Tray and lid are drawn in plan view and squashed by sin(36 degrees) = 0.588. Plan y 0 is the hinge. -->
    <!-- One stemless bud (left): small round shell, short silicone tip toward the middle, round outer face. -->
    <g id="sbBud">
      <g transform="translate(0 128) scale(1 0.588)">
        <ellipse cx="111" cy="46" rx="26" ry="27" fill="#000000" fill-opacity=".2"/>
        <ellipse cx="131" cy="46" rx="6" ry="8" fill="var(--tip)" stroke="var(--bud-edge)" transform="translate(0 4)"/>
        <ellipse cx="131" cy="46" rx="6" ry="8" fill="var(--tip)" stroke="var(--bud-edge)"/>
        <ellipse cx="132.5" cy="46" rx="3" ry="4.6" fill="var(--tip-in)"/>
        <ellipse cx="112" cy="42" rx="22" ry="19" fill="var(--bud-lo)" stroke="var(--bud-edge)" transform="translate(0 8)"/>
        <ellipse cx="112" cy="42" rx="22" ry="19" fill="var(--bud-lo)" transform="translate(0 4)"/>
        <ellipse cx="112" cy="42" rx="22" ry="19" fill="url(#budTop)" stroke="var(--bud-edge)"/>
        <ellipse cx="108" cy="42" rx="13" ry="11.5" fill="url(#budFace)" stroke="var(--face-edge)" stroke-width=".8"/>
        <path d="M99,38 C101,34 106,32 112,32.4" stroke="var(--spec)" stroke-opacity=".7" stroke-width="1.3" stroke-linecap="round" fill="none"/>
        <path d="M95,34 C97,26 104,22 112,21.5" stroke="var(--spec)" stroke-opacity=".75" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      </g>
    </g>
    <!-- Moulded well under each bud -->
    <g id="sbWell">
      <g transform="translate(0 128) scale(1 0.588)" opacity=".3">
        <ellipse cx="113" cy="44" rx="23" ry="24" fill="#000000"/>
        <ellipse cx="132" cy="46" rx="8" ry="10" fill="#000000"/>
      </g>
    </g>
  </defs>

  <g data-part="shadow">
    <ellipse cx="150" cy="204" rx="92" ry="12" fill="url(#shadowSoft)"/>
  </g>

  <g data-part="lid" data-lid="x=80;width=140;depth=50;rx=60;ry=25;hingeY=128;height=14;tilt=36;open=100;domeRadius=12;shine=0.12" data-side-fill="url(#lidSide)" data-rim-stroke="var(--edge)">
    <g transform="scale(1 0.588)">
      <rect x="86" y="7" width="128" height="72" rx="52" ry="36" fill="url(#lidIn)"/>
    </g>
    <rect x="128" y="42" width="44" height="2" rx="1" fill="#ffffff" opacity=".4"/>
  </g>

  <g data-part="body">
    <rect x="128" y="127" width="44" height="5" rx="2.5" fill="url(#hinge)" stroke="var(--hinge-edge)" stroke-width=".8"/>
    <path d="M139,127 L139,132 M161,127 L161,132" stroke="var(--hinge-edge)" stroke-width=".9" fill="none"/>
    <path d="M131,128.6 L169,128.6" stroke="#ffffff" stroke-opacity=".5" stroke-width="1" fill="none"/>
    <path d="M80,153 L80,177 A60,25 0 0 0 140,202 L160,202 A60,25 0 0 0 220,177 L220,153 A60,25 0 0 1 160,178 L140,178 A60,25 0 0 1 80,153 Z" fill="url(#wBody)" stroke="var(--edge)"/>
    <path d="M80,153 L80,177 A60,25 0 0 0 140,202 L160,202 A60,25 0 0 0 220,177 L220,153 A60,25 0 0 1 160,178 L140,178 A60,25 0 0 1 80,153 Z" fill="url(#bodyEdge)"/>
    <ellipse cx="150" cy="190" rx="58" ry="6" fill="url(#glossSoft)"/>
    <rect x="80" y="128" width="140" height="50" rx="60" ry="25" fill="var(--rim-fill)" stroke="var(--edge)"/>
    <g transform="translate(0 128) scale(1 0.588)">
      <rect x="86" y="7" width="128" height="72" rx="52" ry="36" fill="url(#cavity)"/>
    </g>
    <use href="#sbWell"/>
    <use href="#sbWell" transform="translate(300,0) scale(-1,1)"/>
  </g>

  <g data-part="buds">
    <g data-part="bud-left"><use href="#sbBud"/></g>
    <g data-part="bud-right"><use href="#sbBud" transform="translate(300,0) scale(-1,1)"/></g>
  </g>

  <g id="front-lip">
    <path d="M80,153 A60,25 0 0 0 140,178 L160,178 A60,25 0 0 0 220,153 L214,153 A54,20 0 0 1 160,173 L140,173 A54,20 0 0 1 86,153 Z" fill="var(--rim-fill)"/>
    <path d="M80,153 A60,25 0 0 0 140,178 L160,178 A60,25 0 0 0 220,153" fill="none" stroke="var(--edge)"/>
    <path d="M91,160 C99,167 112,172 128,174 L172,174 C188,172 201,167 209,160" stroke="var(--lip)" stroke-width="1.6" fill="none"/>
  </g>
</svg>
