      --body-hi: #5a5d66;
      --body: #2e3036;
      --body-lo: #17181c;
      --edge: #0c0d0f;
      --rim-fill: #34363c;
      --cavity-top: #08080a;
      --cavity-bottom: #2a2c31;
      --lid-shade: #222429;
      --lid-shade-right: #212328;
      --lid-mid: #2b2c32;
      --lid-hi: #2e3036;
      --inside-hi: #3a3c42;
      --inside-lo: #1a1b1e;
      --bud-hi: #666a74;
      --bud: #33353b;
      --bud-lo: #1a1b1f;
      --bud-edge: #08090a;
      --face-hi: #6b6f79;
