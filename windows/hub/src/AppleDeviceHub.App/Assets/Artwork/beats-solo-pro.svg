<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 230">
  <style>
    svg {
      --band-hi: #6a6b6d;
      --band: #2a2b2e;
      --band-lo: #171819;
      --band-edge: #838486;
      --cup-hi: #6c6d6f;
      --cup: #2d2e31;
      --cup-lo: #19191b;
      --cup-edge: #858688;
      --cushion-hi: #535456;
      --cushion: #1d1e20;
      --cushion-lo: #101012;
      --cushion-edge: #7c7c7e;
      --metal-lo: #292a2d;
      --metal-mid: #4a4c51;
      --metal-hi: #aeaeb1;
      --metal-edge: #303135;
      --sheen: #ffffff;
    }
    svg[data-colorway="black"] {
    }
    svg[data-colorway="ivory"] {
      --band-hi: #f1ede5;
      --band: #e6dfd0;
      --band-lo: #b3aea2;
      --band-edge: #8f8a81;
      --cup-hi: #f4f1ea;
      --cup: #ebe5d8;
      --cup-lo: #b7b3a8;
      --cup-edge: #928e86;
      --cushion-hi: #e5e0d6;
      --cushion: #d6cfbf;
      --cushion-lo: #a7a195;
      --cushion-edge: #858076;
      --metal-lo: #77736a;
      --metal-mid: #d8d1c1;
      --metal-hi: #edeae3;
      --metal-edge: #8c887d;
    }
    svg[data-colorway="gray"] {
      --band-hi: #b3b5b9;
      --band: #8a8d93;
      --band-lo: #616367;
      --band-edge: #4c4e51;
      --cup-hi: #b8babe;
      --cup: #92959b;
      --cup-lo: #66686c;
      --cup-edge: #505255;
      --cushion-hi: #96989d;
      --cushion: #6d7077;
      --cushion-lo: #4c4e53;
      --cushion-edge: #3c3e41;
      --metal-lo: #55565a;
      --metal-mid: #9a9da3;
      --metal-hi: #d2d3d6;
      --metal-edge: #64666a;
    }
    svg[data-colorway="dark-blue"] {
      --band-hi: #68748c;
      --band: #27385a;
      --band-lo: #151f32;
      --band-edge: #828c9f;
      --cup-hi: #76829a;
      --cup: #2c3e63;
      --cup-lo: #1f2b45;
      --cup-edge: #182236;
      --cushion-hi: #525d72;
      --cushion: #1c2a45;
      --cushion-lo: #0f1726;
      --cushion-edge: #7b8393;
      --metal-lo: #202a40;
      --metal-mid: #3a4d74;
      --metal-hi: #a6afc0;
      --metal-edge: #26324b;
    }
    svg[data-colorway="light-blue"] {
      --band-hi: #cfddeb;
      --band: #a8c1da;
      --band-lo: #8397aa;
      --band-edge: #687887;
      --cup-hi: #d4e1ee;
      --cup: #b1c9e0;
      --cup-lo: #8a9daf;
      --cup-edge: #6e7d8b;
      --cushion-hi: #b7c7d9;
      --cushion: #8ea8c3;
      --cushion-lo: #6f8398;
      --cushion-edge: #586879;
      --metal-lo: #68737e;
      --metal-mid: #bdd1e5;
      --metal-hi: #e1eaf3;
      --metal-edge: #7b8895;
    }
    svg[data-colorway="red"] {
      --band-hi: #cf686d;
      --band: #b5171f;
      --band-lo: #7f1016;
      --band-edge: #640d11;
      --cup-hi: #d46b71;
      --cup: #bd1c25;
      --cup-lo: #84141a;
      --cup-edge: #680f14;
      --cushion-hi: #aa4a4f;
      --cushion: #8f1118;
      --cushion-lo: #4f090d;
      --cushion-edge: #be7579;
      --metal-lo: #6c272a;
      --metal-mid: #c4474d;
      --metal-hi: #e4acaf;
      --metal-edge: #7f2e32;
    }
  </style>

  <defs>
    <linearGradient id="bandV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--band-hi)"/>
      <stop offset=".4" stop-color="var(--band)"/>
      <stop offset="1" stop-color="var(--band-lo)"/>
    </linearGradient>
    <linearGradient id="padV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--cushion-lo)"/>
      <stop offset=".6" stop-color="var(--cushion)"/>
      <stop offset="1" stop-color="var(--cushion-hi)"/>
    </linearGradient>
    <linearGradient id="cupH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--cup-lo)"/>
      <stop offset=".28" stop-color="var(--cup-hi)"/>
      <stop offset=".62" stop-color="var(--cup)"/>
      <stop offset="1" stop-color="var(--cup-lo)"/>
    </linearGradient>
    <linearGradient id="cushH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--cushion-lo)"/>
      <stop offset=".5" stop-color="var(--cushion)"/>
      <stop offset="1" stop-color="var(--cushion-hi)"/>
    </linearGradient>
    <linearGradient id="metalH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--metal-lo)"/>
      <stop offset=".3" stop-color="var(--metal-hi)"/>
      <stop offset=".65" stop-color="var(--metal-mid)"/>
      <stop offset="1" stop-color="var(--metal-lo)"/>
    </linearGradient>
    <linearGradient id="cupShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".22"/>
    </linearGradient>
    <radialGradient id="shadowSoft" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000000" stop-opacity=".3"/>
      <stop offset=".5" stop-color="#000000" stop-opacity=".18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <g id="side">
      <g transform="rotate(-5 84 166)">
        <path d="M93.5,133.5 L97.5,133.5 C101.9,133.5 105.5,137.1 105.5,141.5 L105.5,190.5 C105.5,194.9 101.9,198.5 97.5,198.5 L93.5,198.5 C92.7,198.5 92,197.8 92,197 L92,135 C92,134.2 92.7,133.5 93.5,133.5 Z" fill="url(#cushH)" stroke="var(--cushion-edge)" stroke-width=".9"/>
        <path d="M103.2,142.5 C104.2,155.5 104.2,176.5 103.2,189.5" stroke="#ffffff" stroke-opacity=".22" stroke-width="1.3" fill="none" stroke-linecap="round"/>
        <path d="M81,128 L91,128 C92.1,128 93,128.9 93,130 L93,202 C93,203.1 92.1,204 91,204 L81,204 C74.4,204 69,198.6 69,192 L69,140 C69,133.4 74.4,128 81,128 Z" fill="url(#cupH)" stroke="var(--cup-edge)" stroke-width=".9"/>
        <path d="M81,128 L91,128 C92.1,128 93,128.9 93,130 L93,202 C93,203.1 92.1,204 91,204 L81,204 C74.4,204 69,198.6 69,192 L69,140 C69,133.4 74.4,128 81,128 Z" fill="url(#cupShade)"/>
        <path d="M73.2,141 C72.6,157 72.6,175 73.2,191" stroke="#ffffff" stroke-opacity=".42" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <path d="M76.2,129.8 L88,129.8" stroke="#ffffff" stroke-opacity=".28" stroke-width="1" fill="none" stroke-linecap="round"/>
        <path d="M93,130 L93,202" stroke="#000000" stroke-opacity=".3" stroke-width="1" fill="none"/>
        <path d="M94.2,132 L94.2,200" stroke="#ffffff" stroke-opacity=".18" stroke-width=".8" fill="none"/>
      </g>
      <path d="M78.5,112 L90.5,112 L91.3,131 C91.5,137 88.5,140.5 84.5,140.5 C80.5,140.5 77.7,137 77.8,131 Z" fill="url(#metalH)" stroke="var(--metal-edge)" stroke-width=".8"/>
      <path d="M81.4,115 L81.8,134" stroke="#ffffff" stroke-opacity=".5" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      <path d="M87.6,115 L88,134" stroke="#000000" stroke-opacity=".14" stroke-width="1" fill="none"/>
    </g>
  </defs>

  <g data-part="shadow">
    <ellipse cx="150" cy="206" rx="96" ry="10.5" fill="url(#shadowSoft)"/>
  </g>

  <g data-part="body">
    <path d="M78,116 C72,59.6 102,22 150,22 C198,22 228,59.6 222,116 L212,116 C212,62.5 191.4,31 150,31 C108.6,31 88,62.5 88,116 Z" fill="url(#bandV)" stroke="var(--band-edge)" stroke-width="1"/>
    <path d="M81,107 C75,62.6 105,25.5 150,25.5 C195,25.5 225,62.6 219,107" stroke="#ffffff" stroke-opacity=".3" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    <path d="M89,107 C89,62.5 112.6,33 150,33 C187.4,33 211,62.5 211,107" stroke="#000000" stroke-opacity=".18" stroke-width="1" fill="none"/>
    <path d="M110,48.2 C125.2,33.8 136.8,31 150,31 C163.2,31 174.8,33.8 190,48.2 C174.8,34 162,39 150,39 C138,39 125.2,34 110,48.2 Z" fill="url(#padV)" stroke="var(--cushion-edge)" stroke-width=".8"/>
    <path d="M122,43 C132,34.5 142,34 150,34 C158,34 168,34.5 178,43" stroke="#ffffff" stroke-opacity=".16" stroke-width="1" fill="none" stroke-linecap="round"/>

    <use href="#side"/>
    <use href="#side" transform="translate(300,0) scale(-1,1)"/>
  </g>
</svg>
