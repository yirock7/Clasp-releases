<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"><style>
    svg {
      --body-hi: #ffffff;
      --body: #f1f2f5;
      --body-lo: #d9dce3;
      --edge: #c2c6ce;
      --rim-fill: #eef0f3;
      --cavity-top: #8b9099;
      --cavity-bottom: #cfd2d8;
      --lid-shade: #cfd3da;
      --lid-shade-right: #cbcfd7;
      --lid-mid: #f4f5f8;
      --inside-hi: #e3e5ea;
      --inside-lo: #b4b8c1;
      --bud-hi: #ffffff;
      --bud: #eceef2;
      --bud-lo: #cfd3da;
      --bud-edge: #bfc3cb;
      --bud-ear: #f1f2f5;
      --bud-ear-in: #d3d6dc;
      --mesh-hi: #55585f;
      --mesh-lo: #121316;
      --metal-lo: #8b94a1;
      --metal-mid: #c3c9d2;
      --metal-hi: #f4f6f9;
      --metal-tip: #9aa3af;
      --lip: #f7f8fa;
      --light: #34c759;
      --light-core: #3ddc66;
    }
    svg[data-colorway="white"] {
    }
  </style>
  <defs>
    <linearGradient id="bodyEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity=".16"/>
      <stop offset=".18" stop-color="#000000" stop-opacity="0"/>
      <stop offset=".82" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".2"/>
    </linearGradient>
    <radialGradient id="mesh" cx=".4" cy=".35" r=".8">
      <stop offset="0" stop-color="var(--mesh-hi)"/>
      <stop offset="1" stop-color="var(--mesh-lo)"/>
    </radialGradient>
    <linearGradient id="wBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--body-hi)"/>
      <stop offset=".6" stop-color="var(--body)"/>
      <stop offset="1" stop-color="var(--body-lo)"/>
    </linearGradient>
    <radialGradient id="wBud" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="var(--bud-hi)"/>
      <stop offset=".7" stop-color="var(--bud)"/>
      <stop offset="1" stop-color="var(--bud-lo)"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--metal-tip)"/>
      <stop offset=".35" stop-color="var(--metal-hi)"/>
      <stop offset=".6" stop-color="var(--metal-mid)"/>
      <stop offset="1" stop-color="var(--metal-lo)"/>
    </linearGradient>
    <linearGradient id="cavity" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--cavity-top)"/>
      <stop offset="1" stop-color="var(--cavity-bottom)"/>
    </linearGradient>
    <linearGradient id="lidSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--lid-shade)"/>
      <stop offset=".16" stop-color="var(--lid-mid)"/>
      <stop offset=".5" stop-color="var(--body-hi)"/>
      <stop offset=".84" stop-color="var(--lid-mid)"/>
      <stop offset="1" stop-color="var(--lid-shade-right)"/>
    </linearGradient>
    <linearGradient id="lidIn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--inside-hi)"/>
      <stop offset="1" stop-color="var(--inside-lo)"/>
    </linearGradient>
    <!-- Soft shapes that replace blur filters: fade to nothing at the edge. -->
    <radialGradient id="shadowSoft" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000000" stop-opacity=".26"/>
      <stop offset=".5" stop-color="#000000" stop-opacity=".16"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glossSoft" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lightGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="var(--light)" stop-opacity=".55"/>
      <stop offset=".45" stop-color="var(--light)" stop-opacity=".3"/>
      <stop offset="1" stop-color="var(--light)" stop-opacity="0"/>
    </radialGradient>

    <!-- One earbud (left); the right one is this mirrored. Drawn unclipped: the front lip below hides the stem inside the case. -->
    <g id="apBud">
      <rect x="105" y="103" width="11" height="30" rx="5.5" fill="url(#wBud)" stroke="var(--bud-edge)" transform="rotate(6 110 106)"/>
      <ellipse cx="132" cy="100" rx="7.5" ry="11" fill="var(--bud-ear)" stroke="var(--bud-edge)" transform="rotate(30 132 100)"/>
      <ellipse cx="134" cy="97.5" rx="4" ry="6.2" fill="var(--bud-ear-in)" transform="rotate(30 134 97.5)"/>
      <path d="M97,101 C95,90 103,83 114,83 C126,83 134,90 133,101 C132,111 124,116 114,116 C104,116 98,110 97,101 Z" fill="url(#wBud)" stroke="var(--bud-edge)"/>
      <rect x="100" y="90" width="14" height="4.2" rx="2.1" fill="url(#mesh)" transform="rotate(-36 107 92)"/>
      <circle cx="121" cy="106" r="1.5" fill="#2a2c30"/>
      <path d="M101,96 C103,90 108,87 114,86" stroke="#ffffff" stroke-opacity=".9" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </g>
  
    <filter id="blurK" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="blurKm" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
    <filter id="blurK2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <linearGradient id="paneK" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A4170"/><stop offset=".55" stop-color="#262B4D"/><stop offset="1" stop-color="#171A31"/></linearGradient>
    <mask id="edgeK" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect x="0" y="0" width="1024" height="1024" fill="#fff"/>
      <rect x="40" y="40" width="944" height="944" rx="230" fill="#000" filter="url(#blurKm)"/>
    </mask>
    <linearGradient id="prismK" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7FF3F8"/><stop offset=".35" stop-color="#B6A2FF"/><stop offset=".7" stop-color="#FF9FCF"/><stop offset="1" stop-color="#8FA6FF"/></linearGradient>
    <clipPath id="tcK"><rect x="56" y="56" width="912" height="912" rx="214"/></clipPath>

    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset=".45" stop-color="#FFFFFF" stop-opacity=".25"/>
      <stop offset="1" stop-color="#2A3050" stop-opacity=".55"/></linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".30"/><stop offset=".6" stop-color="#FFFFFF" stop-opacity=".06"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <filter id="specBlur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <linearGradient id="prism" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5FE3E0" stop-opacity=".9"/><stop offset=".5" stop-color="#8B6CFF" stop-opacity=".7"/>
      <stop offset="1" stop-color="#FF7FB8" stop-opacity=".9"/></linearGradient>
</defs>
  <g clip-path="url(#tcK)"><rect x="56" y="56" width="912" height="912" rx="214" fill="url(#paneK)"/>
      <g mask="url(#edgeK)"><g filter="url(#blurK)">
        <circle cx="140" cy="160" r="330" fill="#1FB9C8"/>
        <circle cx="910" cy="200" r="330" fill="#6E4CF0"/>
        <circle cx="900" cy="860" r="300" fill="#D2488C"/>
        <circle cx="400" cy="1000" r="260" fill="#C7579E"/>
        <circle cx="110" cy="880" r="280" fill="#3456DA"/>
      </g></g>
      <ellipse cx="512" cy="700" rx="290" ry="110" fill="#05060F" opacity=".45" filter="url(#blurK2)"/><rect x="60" y="60" width="904" height="904" rx="210" fill="none" stroke="url(#prismK)" stroke-width="3" opacity=".35"/>
      <rect x="64" y="64" width="896" height="896" rx="206" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity=".28"/></g>
  <path d="M 120,270 C 140,120 260,80 512,80 C 764,80 884,120 904,270 C 760,220 640,206 512,206 C 384,206 264,220 120,270 Z" fill="url(#spec)" filter="url(#specBlur)"/>
  <rect x="56" y="56" width="912" height="912" rx="214" fill="none" stroke="url(#prism)" stroke-width="10" opacity=".55"/>
  <rect x="62" y="62" width="900" height="900" rx="208" fill="none" stroke="url(#rim)" stroke-width="7"/>
  <g transform="translate(-130,-170) scale(4.28)"><g data-part="shadow">
    <ellipse cx="150" cy="208" rx="104" ry="19" fill="url(#shadowSoft)"/>
  </g>
  <g>
    <path d="M71,120 L71,160 C71,188 92,202 120,202 L180,202 C208,202 229,188 229,160 L229,120 Z" fill="url(#wBody)" stroke="var(--edge)"/>
    <path d="M71,120 L71,160 C71,188 92,202 120,202 L180,202 C208,202 229,188 229,160 L229,120 Z" fill="url(#bodyEdge)"/>
    <path d="M71,126 L71,112 C71,100 82,92 97,92 L203,92 C218,92 229,100 229,112 L229,126 Z" fill="url(#wBody)" stroke="var(--edge)"/>
    <path d="M78,104 C84,97 92,96 100,96 L200,96 C208,96 216,97 222,104" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <rect x="71" y="124" width="158" height="4.5" fill="#9AA6C4"/>
    <ellipse cx="150" cy="160" rx="16" ry="16" fill="url(#lightGlow)"/>
    <circle cx="150" cy="160" r="6" fill="var(--light-core)"/>
  </g></g>
</svg>
